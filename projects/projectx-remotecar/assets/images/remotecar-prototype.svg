<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="75%">
      <stop offset="0" stop-color="#1a102c"/>
      <stop offset="1" stop-color="#05030a"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="600" fill="url(#bg)"/>
  <g opacity="0.05" stroke="#b06aff">
    <path d="M0 100 H1000 M0 200 H1000 M0 300 H1000 M0 400 H1000 M0 500 H1000"/>
    <path d="M100 0 V600 M200 0 V600 M300 0 V600 M400 0 V600 M500 0 V600 M600 0 V600 M700 0 V600 M800 0 V600 M900 0 V600"/>
  </g>

  <!-- Title -->
  <text x="500" y="60" text-anchor="middle" font-family="'Orbitron', sans-serif" font-size="28" font-weight="800" fill="#b06aff" letter-spacing="4" filter="url(#glow)">PROJECT X · REMOTE CAR</text>
  <text x="500" y="90" text-anchor="middle" font-family="monospace" font-size="12" fill="#8b9bb8" letter-spacing="3">DUAL-DRIVER BLUETOOTH CONTROLLED 4WD ROVER</text>

  <!-- Top-Down View of the Rover -->
  <g transform="translate(500, 320)">
    
    <!-- Chassis Base -->
    <circle cx="0" cy="0" r="160" fill="#0d1522" stroke="#26344c" stroke-width="3" filter="url(#shadow)"/>
    <circle cx="0" cy="0" r="140" fill="none" stroke="#2fd4ff" stroke-width="1" opacity="0.3" stroke-dasharray="5 5"/>
    
    <!-- Wheels -->
    <g filter="url(#shadow)">
      <!-- Top Left -->
      <rect x="-130" y="-140" width="40" height="70" rx="8" fill="#1a2537" stroke="#54647e"/>
      <!-- Top Right -->
      <rect x="90" y="-140" width="40" height="70" rx="8" fill="#1a2537" stroke="#54647e"/>
      <!-- Bottom Left -->
      <rect x="-130" y="70" width="40" height="70" rx="8" fill="#1a2537" stroke="#54647e"/>
      <!-- Bottom Right -->
      <rect x="90" y="70" width="40" height="70" rx="8" fill="#1a2537" stroke="#54647e"/>
    </g>

    <!-- Arduino Nano (Center Top) -->
    <rect x="-30" y="-80" width="60" height="80" rx="4" fill="#00979D" stroke="#2fd4ff" stroke-width="1.5"/>
    <text x="0" y="-40" text-anchor="middle" font-family="monospace" font-size="8" fill="#fff">NANO</text>

    <!-- L298N Driver 1 (Left) -->
    <rect x="-90" y="-20" width="60" height="70" rx="4" fill="#1a102c" stroke="#ffb347" stroke-width="1.5"/>
    <text x="-60" y="15" text-anchor="middle" font-family="monospace" font-size="8" fill="#ffb347">L298N</text>
    <text x="-60" y="30" text-anchor="middle" font-family="monospace" font-size="6" fill="#54647e">#1</text>

    <!-- L298N Driver 2 (Right) -->
    <rect x="30" y="-20" width="60" height="70" rx="4" fill="#1a102c" stroke="#ffb347" stroke-width="1.5"/>
    <text x="60" y="15" text-anchor="middle" font-family="monospace" font-size="8" fill="#ffb347">L298N</text>
    <text x="60" y="30" text-anchor="middle" font-family="monospace" font-size="6" fill="#54647e">#2</text>

    <!-- HC-05 Bluetooth Module (Bottom Center) -->
    <rect x="-20" y="60" width="40" height="30" rx="3" fill="#0a1a26" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="0" y="78" text-anchor="middle" font-family="monospace" font-size="7" fill="#38bdf8">HC-05</text>

    <!-- Battery Pack (Center Bottom) -->
    <rect x="-45" y="100" width="90" height="40" rx="4" fill="#111b2c" stroke="#ff5d73" stroke-width="1.5"/>
    <text x="0" y="125" text-anchor="middle" font-family="monospace" font-size="7" fill="#ff5d73">BATTERY</text>

    <!-- Wires (Stylized) -->
    <g stroke-width="2" fill="none" opacity="0.6">
      <path d="M -30 -40 L -60 -20" stroke="#2fd4ff"/>
      <path d="M 30 -40 L 60 -20" stroke="#2fd4ff"/>
      <path d="M 0 60 L 0 40" stroke="#38bdf8"/>
      <path d="M -60 50 L -60 80 L 0 80" stroke="#ffb347"/>
      <path d="M 60 50 L 60 80 L 0 80" stroke="#ffb347"/>
    </g>

    <!-- Direction Arrow -->
    <path d="M 0 -180 L -15 -150 L 15 -150 Z" fill="#2fd4ff" filter="url(#glow)"/>
    <text x="0" y="-190" text-anchor="middle" font-family="monospace" font-size="10" fill="#2fd4ff">FORWARD</text>

  </g>

  <!-- Labels for components (Bottom) -->
  <g transform="translate(0, 540)" font-family="monospace" font-size="10" fill="#8b9bb8">
    <text x="150" text-anchor="middle" fill="#00979D">■ Arduino Nano</text>
    <text x="350" text-anchor="middle" fill="#ffb347">■ Dual L298N</text>
    <text x="550" text-anchor="middle" fill="#38bdf8">■ HC-05</text>
    <text x="750" text-anchor="middle" fill="#ff5d73">■ Battery Pack</text>
  </g>

</svg>

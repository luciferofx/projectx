<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="75%">
      <stop offset="0" stop-color="#1a102c"/>
      <stop offset="1" stop-color="#05030a"/>
    </radialGradient>
    <linearGradient id="board" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#132a3a"/>
      <stop offset="1" stop-color="#0b1a26"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="600" fill="url(#bg)"/>
  <g opacity="0.05" stroke="#2fd4ff">
    <path d="M0 100 H1000 M0 200 H1000 M0 300 H1000 M0 400 H1000 M0 500 H1000"/>
    <path d="M100 0 V600 M200 0 V600 M300 0 V600 M400 0 V600 M500 0 V600 M600 0 V600 M700 0 V600 M800 0 V600 M900 0 V600"/>
  </g>

  <!-- Title -->
  <text x="500" y="60" text-anchor="middle" font-family="'Orbitron', sans-serif" font-size="26" font-weight="800" fill="#2fd4ff" letter-spacing="4" filter="url(#glow)">PROJECT X · ARMY GATE</text>
  <text x="500" y="90" text-anchor="middle" font-family="monospace" font-size="12" fill="#8b9bb8" letter-spacing="3">RFID AUTOMATED SECURITY BARRIER</text>

  <!-- Arduino Mega -->
  <g filter="url(#shadow)" transform="translate(150, 200)">
    <rect width="220" height="280" rx="8" fill="url(#board)" stroke="#26344c"/>
    <text x="110" y="30" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#2fd4ff">ARDUINO MEGA</text>
    <text x="110" y="45" text-anchor="middle" font-family="monospace" font-size="10" fill="#54647e">ATmega2560</text>
    
    <!-- Pins -->
    <rect x="20" y="80" width="30" height="10" fill="#1a2537"/>
    <rect x="20" y="110" width="30" height="10" fill="#1a2537"/>
    <rect x="20" y="140" width="30" height="10" fill="#1a2537"/>
    <rect x="20" y="170" width="30" height="10" fill="#1a2537"/>
    <rect x="170" y="80" width="30" height="10" fill="#1a2537"/>
    
    <text x="55" y="88" font-family="monospace" font-size="10" fill="#6ff0c2">Pin 53 (SS)</text>
    <text x="55" y="118" font-family="monospace" font-size="10" fill="#6ff0c2">Pin 5 (RST)</text>
    <text x="55" y="148" font-family="monospace" font-size="10" fill="#6ff0c2">Pin 9 (PWM)</text>
    <text x="55" y="178" font-family="monospace" font-size="10" fill="#6ff0c2">Pin 6 (BUZZ)</text>
    <text x="120" y="88" font-family="monospace" font-size="10" fill="#ffb347" text-anchor="end">Pin 7 (RED)</text>
    <text x="120" y="118" font-family="monospace" font-size="10" fill="#ffb347" text-anchor="end">Pin 8 (GRN)</text>
  </g>

  <!-- RFID Module (Left) -->
  <g filter="url(#shadow)" transform="translate(50, 350)">
    <rect width="140" height="100" rx="6" fill="#0a1a26" stroke="#2fd4ff" opacity="0.8"/>
    <rect x="10" y="10" width="120" height="80" rx="2" fill="#03060c" stroke="#1a2537"/>
    <circle cx="70" cy="50" r="25" fill="none" stroke="#2fd4ff" stroke-width="1.5" opacity="0.5" stroke-dasharray="4 2"/>
    <circle cx="70" cy="50" r="15" fill="none" stroke="#2fd4ff" stroke-width="1.5" opacity="0.5" stroke-dasharray="3 3"/>
    <text x="70" y="105" text-anchor="middle" font-family="monospace" font-size="10" fill="#2fd4ff">MFRC522</text>
  </g>
  
  <!-- Wires to RFID -->
  <path d="M 170 400 Q 220 400 220 360 L 250 360" stroke="#2fd4ff" stroke-width="2" fill="none" filter="url(#glow)"/>
  <path d="M 170 420 Q 240 420 240 380 L 250 380" stroke="#6ff0c2" stroke-width="2" fill="none"/>

  <!-- RFID Card (Floating) -->
  <g transform="translate(70, 480)" opacity="0.8">
    <rect width="60" height="40" rx="4" fill="#101c2a" stroke="#a78bfa"/>
    <rect x="10" y="10" width="20" height="15" rx="2" fill="#a78bfa" opacity="0.3"/>
    <text x="30" y="30" text-anchor="middle" font-family="monospace" font-size="8" fill="#a78bfa">CARD</text>
  </g>
  
  <!-- RF Waves -->
  <path d="M 130 500 Q 150 480 130 460" stroke="#a78bfa" stroke-width="2" fill="none" stroke-dasharray="3 3"/>
  <path d="M 140 510 Q 165 480 140 450" stroke="#a78bfa" stroke-width="2" fill="none" stroke-dasharray="3 3" opacity="0.5"/>
  <path d="M 150 520 Q 180 480 150 440" stroke="#a78bfa" stroke-width="2" fill="none" stroke-dasharray="3 3" opacity="0.2"/>

  <!-- Servo Motor & Gate -->
  <g filter="url(#shadow)" transform="translate(600, 200)">
    <!-- Servo Body -->
    <rect x="0" y="100" width="80" height="120" rx="6" fill="#0d1a28" stroke="#ffb347"/>
    <circle cx="40" cy="100" r="25" fill="#1a2537" stroke="#ffb347"/>
    <circle cx="40" cy="100" r="10" fill="#ffb347"/>
    <text x="40" y="240" text-anchor="middle" font-family="monospace" font-size="12" fill="#ffb347">SERVO</text>

    <!-- Gate Barrier -->
    <g transform="translate(40, 100)">
      <!-- Gate Arm -->
      <rect x="0" y="-10" width="250" height="15" rx="4" fill="#2a1520" stroke="#ff5d73" stroke-width="2" filter="url(#glow)"/>
      <!-- Stripes -->
      <rect x="20" y="-10" width="30" height="15" fill="#ff5d73" opacity="0.4"/>
      <rect x="80" y="-10" width="30" height="15" fill="#ff5d73" opacity="0.4"/>
      <rect x="140" y="-10" width="30" height="15" fill="#ff5d73" opacity="0.4"/>
      <rect x="200" y="-10" width="30" height="15" fill="#ff5d73" opacity="0.4"/>
    </g>
    
    <!-- Gate Post -->
    <rect x="-10" y="100" width="20" height="160" fill="#1a2537" stroke="#26344c"/>
  </g>

  <!-- LEDs & Buzzer -->
  <g transform="translate(420, 380)">
    <!-- Green LED -->
    <circle cx="20" cy="20" r="10" fill="#6ff0c2" filter="url(#glow)"/>
    <text x="20" y="45" text-anchor="middle" font-family="monospace" font-size="10" fill="#6ff0c2">GREEN</text>
    
    <!-- Red LED -->
    <circle cx="70" cy="20" r="10" fill="#ff5d73" filter="url(#glow)"/>
    <text x="70" y="45" text-anchor="middle" font-family="monospace" font-size="10" fill="#ff5d73">RED</text>

    <!-- Buzzer -->
    <circle cx="120" cy="20" r="12" fill="#1a2537" stroke="#ffb347"/>
    <circle cx="120" cy="20" r="5" fill="#ffb347"/>
    <text x="120" y="45" text-anchor="middle" font-family="monospace" font-size="10" fill="#ffb347">BUZZER</text>
  </g>

  <!-- Connecting Wires (Arduino to Components) -->
  <!-- Servo Wire -->
  <path d="M 370 360 Q 450 360 450 320 L 600 320" stroke="#ffb347" stroke-width="2" fill="none" filter="url(#glow)"/>
  <!-- LED Wires -->
  <path d="M 370 390 Q 400 390 420 400" stroke="#6ff0c2" stroke-width="2" fill="none"/>
  <path d="M 370 410 Q 400 410 420 400" stroke="#ff5d73" stroke-width="2" fill="none"/>
  <!-- Buzzer Wire -->
  <path d="M 370 380 Q 450 380 540 400" stroke="#ffb347" stroke-width="2" fill="none"/>

</svg>

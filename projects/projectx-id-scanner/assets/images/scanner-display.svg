<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="75%">
      <stop offset="0" stop-color="#1a2333"/>
      <stop offset="1" stop-color="#05080e"/>
    </radialGradient>
    <linearGradient id="board" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12303f"/>
      <stop offset="1" stop-color="#0a1a26"/>
    </linearGradient>
    <linearGradient id="oled" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e1a24"/>
      <stop offset="1" stop-color="#060c14"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1a26"/>
      <stop offset="1" stop-color="#020810"/>
    </linearGradient>
    <linearGradient id="mpu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d2436"/>
      <stop offset="1" stop-color="#071620"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="6"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.6"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1600" height="900" fill="url(#bg)"/>
  <g opacity="0.06" stroke="#2fd4ff">
    <path d="M0 100 H1600 M0 200 H1600 M0 300 H1600 M0 400 H1600 M0 500 H1600 M0 600 H1600 M0 700 H1600 M0 800 H1600"/>
    <path d="M100 0 V900 M200 0 V900 M300 0 V900 M400 0 V900 M500 0 V900 M600 0 V900 M700 0 V900 M800 0 V900 M900 0 V900 M1000 0 V900 M1100 0 V900 M1200 0 V900 M1300 0 V900 M1400 0 V900 M1500 0 V900"/>
  </g>

  <!-- breadboard -->
  <rect x="120" y="520" width="1360" height="300" rx="14" fill="#0e0e12" stroke="#1c1c22" filter="url(#shadow)"/>
  <rect x="140" y="540" width="1320" height="260" rx="6" fill="#16161c"/>
  <g fill="#0a0a0e">
    <rect x="160" y="560" width="1280" height="10" rx="2"/>
    <rect x="160" y="600" width="1280" height="4"/>
    <rect x="160" y="640" width="1280" height="4"/>
    <rect x="160" y="680" width="1280" height="4"/>
    <rect x="160" y="720" width="1280" height="4"/>
    <rect x="160" y="760" width="1280" height="10" rx="2"/>
  </g>
  <g fill="#3a3a44">
    <rect x="160" y="580" width="1280" height="10" rx="2"/>
  </g>

  <!-- jumper wires -->
  <path d="M 620 470 Q 700 520 780 470" stroke="#2fd4ff" stroke-width="5" fill="none" opacity="0.85" filter="url(#glow)"/>
  <path d="M 640 470 Q 720 540 800 470" stroke="#6ff0c2" stroke-width="5" fill="none" opacity="0.85" filter="url(#glow)"/>
  <path d="M 660 470 Q 740 560 820 470" stroke="#ffb347" stroke-width="5" fill="none" opacity="0.85"/>
  <path d="M 680 470 Q 760 580 840 470" stroke="#ff5d73" stroke-width="5" fill="none" opacity="0.85"/>

  <!-- Arduino Nano board -->
  <g filter="url(#shadow)">
    <rect x="540" y="310" width="320" height="180" rx="8" fill="url(#board)" stroke="#1d4a5e" stroke-width="1.5"/>
    <!-- usb -->
    <rect x="840" y="380" width="26" height="44" rx="2" fill="#1a2537" stroke="#26344c"/>
    <!-- pin headers -->
    <rect x="560" y="298" width="280" height="16" rx="2" fill="#0a1620" stroke="#1d4a5e"/>
    <rect x="560" y="486" width="280" height="16" rx="2" fill="#0a1620" stroke="#1d4a5e"/>
    <!-- ATmega chip -->
    <rect x="640" y="360" width="100" height="72" rx="3" fill="#0a0a10" stroke="#26344c"/>
    <text x="690" y="400" text-anchor="middle" font-family="monospace" font-size="10" fill="#54647e">ATmega</text>
    <text x="690" y="414" text-anchor="middle" font-family="monospace" font-size="10" fill="#54647e">328P</text>
    <!-- silkscreen -->
    <text x="565" y="340" font-family="'Orbitron',sans-serif" font-size="11" fill="#2fd4ff" font-weight="700" letter-spacing="1">ARDUINO NANO</text>
    <text x="565" y="356" font-family="monospace" font-size="8" fill="#54647e">PROJECT X · ID SCANNER</text>
    <!-- onboard LED -->
    <circle cx="820" cy="340" r="4" fill="#ff5d73" filter="url(#glow)"/>
    <!-- pin labels -->
    <g font-family="monospace" font-size="7" fill="#6ff0c2">
      <text x="575" y="310">A4</text>
      <text x="595" y="310">A5</text>
      <text x="615" y="310">5V</text>
      <text x="635" y="310">GND</text>
    </g>
    <!-- pin dots -->
    <g fill="#2fd4ff">
      <circle cx="578" cy="306" r="2.5"/>
      <circle cx="598" cy="306" r="2.5"/>
      <circle cx="618" cy="306" r="2.5"/>
      <circle cx="638" cy="306" r="2.5"/>
    </g>
  </g>

  <!-- SSD1306 OLED -->
  <g filter="url(#shadow)">
    <rect x="960" y="270" width="280" height="200" rx="10" fill="url(#oled)" stroke="#1d4a5e" stroke-width="1.5"/>
    <!-- screen -->
    <rect x="985" y="292" width="230" height="120" rx="4" fill="url(#screen)" stroke="#0d2836"/>
    <!-- screen glow -->
    <rect x="990" y="297" width="220" height="110" rx="3" fill="#041018"/>
    <!-- screen content -->
    <text x="1100" y="322" text-anchor="middle" font-family="'Orbitron',sans-serif" font-size="14" fill="#6ff0c2" font-weight="700" letter-spacing="2">I2C SCANNER</text>
    <text x="1100" y="345" text-anchor="middle" font-family="monospace" font-size="11" fill="#2fd4ff">Scanning...</text>
    <text x="1100" y="365" text-anchor="middle" font-family="monospace" font-size="10" fill="#dde5f4">0x3C SSD1306 ✓</text>
    <text x="1100" y="382" text-anchor="middle" font-family="monospace" font-size="10" fill="#dde5f4">0x68 DS1307  ✓</text>
    <text x="1100" y="399" text-anchor="middle" font-family="monospace" font-size="10" fill="#dde5f4">0x69 MPU6050 ✓</text>
    <!-- silkscreen -->
    <text x="975" y="288" font-family="monospace" font-size="8" fill="#54647e">SSD1306 · 128×64</text>
    <!-- pins -->
    <g font-family="monospace" font-size="7" fill="#6ff0c2">
      <text x="990" y="435">SDA</text>
      <text x="1020" y="435">SCL</text>
      <text x="1050" y="435">VCC</text>
      <text x="1080" y="435">GND</text>
    </g>
    <g fill="#2fd4ff">
      <circle cx="995" cy="455" r="3"/>
      <circle cx="1025" cy="455" r="3"/>
      <circle cx="1055" cy="455" r="3"/>
      <circle cx="1085" cy="455" r="3"/>
    </g>
  </g>

  <!-- MPU6050 module -->
  <g filter="url(#shadow)">
    <rect x="300" y="300" width="160" height="140" rx="8" fill="url(#mpu)" stroke="#1d4a5e" stroke-width="1.5"/>
    <rect x="330" y="330" width="100" height="80" rx="3" fill="#0a0a10" stroke="#26344c"/>
    <text x="380" y="375" text-anchor="middle" font-family="monospace" font-size="10" fill="#54647e">MPU</text>
    <text x="380" y="389" text-anchor="middle" font-family="monospace" font-size="10" fill="#54647e">6050</text>
    <text x="312" y="322" font-family="monospace" font-size="8" fill="#6ff0c2">GY-521 · 0x69</text>
    <!-- pins -->
    <g font-family="monospace" font-size="7" fill="#6ff0c2">
      <text x="315" y="452">VCC</text>
      <text x="345" y="452">GND</text>
      <text x="375" y="452">SCL</text>
      <text x="405" y="452">SDA</text>
    </g>
    <g fill="#2fd4ff">
      <circle cx="320" cy="470" r="3"/>
      <circle cx="350" cy="470" r="3"/>
      <circle cx="380" cy="470" r="3"/>
      <circle cx="410" cy="470" r="3"/>
    </g>
  </g>

  <!-- labels / callouts -->
  <g font-family="monospace" font-size="11" fill="#8b9bb8">
    <text x="700" y="525" text-anchor="middle">I²C BUS · 100 kHz · 4.7kΩ pull-ups</text>
  </g>

  <!-- title overlay -->
  <text x="800" y="80" text-anchor="middle" font-family="'Orbitron',sans-serif" font-size="28" fill="#2fd4ff" font-weight="800" letter-spacing="4" filter="url(#glow)">PROJECT X · ID SCANNER</text>
  <text x="800" y="108" text-anchor="middle" font-family="monospace" font-size="12" fill="#6ff0c2" letter-spacing="3">I²C DIAGNOSTIC TERMINAL · 3 DEVICES ACKED</text>

  <!-- bottom status bar -->
  <g font-family="monospace" font-size="10" fill="#54647e">
    <text x="140" y="870">STATUS: LINK ACTIVE</text>
    <text x="500" y="870">BAUD: 9600</text>
    <text x="750" y="870">ADDR RANGE: 0x01–0x7E</text>
    <text x="1050" y="870">SCAN CYCLE: #12</text>
    <text x="1350" y="870" fill="#6ff0c2">✓ READY</text>
  </g>
</svg>
